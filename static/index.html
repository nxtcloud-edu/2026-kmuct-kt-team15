<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- 2. design tokens ---------- */
:root{
  --ground:#F2F4F6; --surface:#FFFFFF; --fill:#F2F4F6; --text:#191F28; --sub:#4E5968;
  --muted:#8B95A1; --line:#E5E8EB; --accent:#3182F6; --accent-press:#1B64DA;
  --accent-weak:#E8F3FF; --on-accent:#FFFFFF; --urgent:#F04452; --ok:#15B886;
  --shadow:0 12px 40px rgba(25,31,40,.14);
  --tone-sem-bg:hsl(255 40% 95%); --tone-sem-fg:hsl(255 40% 37%);
  --tone-gpa-bg:hsl(150 40% 94%); --tone-gpa-fg:hsl(150 42% 32%);
  --tone-lang-bg:hsl(32 45% 94%); --tone-lang-fg:hsl(28 45% 38%);
  --tone-major-bg:hsl(178 38% 94%); --tone-major-fg:hsl(178 40% 30%);
  --tone-any-bg:hsl(335 38% 95%); --tone-any-fg:hsl(335 40% 40%);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B0C10; --surface:#17171C; --fill:#24242B; --text:#F2F4F6; --sub:#B0B8C1;
    --muted:#7E8792; --line:#2C2C35; --accent:#4B96FA; --accent-press:#2F7BE8;
    --accent-weak:#1A2940; --urgent:#FF5C69; --ok:#2DCB97;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    --tone-sem-bg:hsl(255 28% 20%); --tone-sem-fg:hsl(255 45% 78%);
    --tone-gpa-bg:hsl(150 26% 18%); --tone-gpa-fg:hsl(150 40% 75%);
    --tone-lang-bg:hsl(32 28% 20%); --tone-lang-fg:hsl(32 45% 78%);
    --tone-major-bg:hsl(178 26% 18%); --tone-major-fg:hsl(178 40% 75%);
    --tone-any-bg:hsl(335 26% 20%); --tone-any-fg:hsl(335 40% 80%);
  }
}
:root[data-theme="dark"]{
  --ground:#0B0C10; --surface:#17171C; --fill:#24242B; --text:#F2F4F6; --sub:#B0B8C1;
  --muted:#7E8792; --line:#2C2C35; --accent:#4B96FA; --accent-press:#2F7BE8;
  --accent-weak:#1A2940; --urgent:#FF5C69; --ok:#2DCB97;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --tone-sem-bg:hsl(255 28% 20%); --tone-sem-fg:hsl(255 45% 78%);
  --tone-gpa-bg:hsl(150 26% 18%); --tone-gpa-fg:hsl(150 40% 75%);
  --tone-lang-bg:hsl(32 28% 20%); --tone-lang-fg:hsl(32 45% 78%);
  --tone-major-bg:hsl(178 26% 18%); --tone-major-fg:hsl(178 40% 75%);
  --tone-any-bg:hsl(335 26% 20%); --tone-any-fg:hsl(335 40% 80%);
}

/* ---------- 1. frame ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  height:100dvh; overflow:hidden; background:var(--surface); color:var(--text);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-size:16px; line-height:1.5;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#app{height:100dvh}
.screen{height:100dvh; display:flex; flex-direction:column; background:var(--surface)}
.screen.ground{background:var(--ground)}
.screen.enter{animation:screen-in .2s ease-out}
@keyframes screen-in{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}
.col{width:100%; max-width:600px; margin:0 auto; padding-left:20px; padding-right:20px}
.scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.bottom{background:var(--surface); padding-top:12px; padding-bottom:max(16px,var(--safe-b))}

/* 3. top bar */
.topbar{height:56px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--sub)}
.iconbtn:hover{background:var(--fill)}
.iconbtn.sm{width:34px;height:34px}
.iconbtn.back{margin-left:-10px}
@media (min-width:768px){
  .topbar{height:72px}
  .tabbar{padding-bottom:20px}
}

/* 3. type */
.h1{font-size:26px;font-weight:800;line-height:1.38;letter-spacing:-.02em;white-space:pre-line;margin:0}
.h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:16px;color:var(--sub);margin-top:8px}
.label{font-size:14px;color:var(--muted);font-weight:500}
.tabtitle{font-size:20px;font-weight:800}

/* 3. buttons */
.cta{width:100%;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:700}
.cta:hover{background:var(--accent-press)}
.cta.weak{background:var(--fill);color:var(--sub)}
.cta.weak:hover{background:var(--line)}
.cta[disabled],.cta.off{background:var(--fill);color:var(--muted);cursor:default}
.tbtn{font-size:14px;color:var(--muted);font-weight:500;padding:8px 0;text-decoration:none}
.tbtn:hover{color:var(--sub)}

/* 3. card, chips, inputs */
.card{background:var(--surface);border-radius:20px;padding:20px}
.chip{padding:10px 16px;border-radius:12px;background:var(--fill);font-size:15px;font-weight:500;color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.field>.label{display:block;margin-bottom:10px}
.inrow{display:flex;align-items:baseline;gap:8px}
.inp{border:0;border-bottom:2px solid var(--line);background:none;padding:8px 0;font-size:22px;font-weight:700;width:100%}
.inp:focus{outline:none;border-bottom-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none}
.unit{font-size:20px;color:var(--muted);font-weight:700}
.combo{position:relative}
.combo .list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;max-height:260px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px}
.combo .grp{font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.combo .opt{display:block;width:100%;text-align:left;font-size:15px;padding:10px;border-radius:10px}
.combo .opt:hover{background:var(--fill)}
.combo .none{text-align:center;font-size:14px;color:var(--muted);padding:16px}
.prog{height:4px;background:var(--line);border-radius:2px;flex:1;margin-left:8px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:2px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* 3. match chip + tooltip */
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{position:relative;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.mchip.pass.sem{background:var(--tone-sem-bg);color:var(--tone-sem-fg)}
.mchip.pass.gpa{background:var(--tone-gpa-bg);color:var(--tone-gpa-fg)}
.mchip.pass.lang{background:var(--tone-lang-bg);color:var(--tone-lang-fg)}
.mchip.pass.major{background:var(--tone-major-bg);color:var(--tone-major-fg)}
.mchip.pass.any{background:var(--tone-any-bg);color:var(--tone-any-fg)}
.mchip.off{background:none;border:1px dashed var(--line);color:var(--sub)}
.mchip.fail{background:none;border:1px dashed var(--line);color:var(--muted)}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:20;
  background:var(--text);color:var(--surface);font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;
  max-width:240px;width:max-content;text-align:center;line-height:1.5;white-space:normal;animation:tip-in .12s ease-out}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--text)}
.mchip.first .tip{left:0;transform:none}
.mchip.first .tip::after{left:14px;margin-left:0}
.mchip.last .tip{left:auto;right:0;transform:none}
.mchip.last .tip::after{left:auto;right:14px;margin-left:0}
@keyframes tip-in{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1}}

/* 3. notice row */
.row{padding:14px 0}
.row .top{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.row .ttl{font-size:17px;font-weight:700;line-height:1.4}
.row .new{font-size:13px;color:var(--accent);font-weight:700;margin-right:4px}
.row .sub{font-size:14px;color:var(--muted);margin-top:2px}
.row.dim .ttl{color:var(--muted)}
.row .mchips{margin-top:10px}
.more{width:100%;text-align:center;padding:14px 0 2px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);margin-top:6px}

/* 3. check rows, lists, tables */
.check{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check[aria-checked="true"] .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.check .ttl{font-size:18px;font-weight:700}
.check[aria-checked="true"] .ttl{color:var(--muted);text-decoration:line-through}
.check .sml{font-size:14px;color:var(--muted)}
.task{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.task .dot{width:24px;height:24px}
.task[aria-checked="true"] .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.task[aria-checked="true"] .name{color:var(--muted);text-decoration:line-through}
.task .when{margin-left:auto;font-size:14px;color:var(--muted)}
.task.on{background:var(--accent-weak);border-radius:10px}
.steps{display:flex;flex-direction:column;gap:14px}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--fill);color:var(--sub);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.kv{display:flex;gap:12px;font-size:16px}
.kv+.kv{margin-top:10px}
.kv>dt{width:80px;flex:none;color:var(--muted);margin:0}
.kv>dd{margin:0;line-height:1.5}
.verdict{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.verdict .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800;flex:none}
.verdict.ok .ic{background:var(--ok)} .verdict.no .ic{background:var(--urgent)} .verdict.wait .ic{background:var(--muted)}
.askrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--fill);border-radius:12px;font-size:14px;color:var(--sub)}
.askrow .tbtn{color:var(--accent)}
.sec{padding:24px 0;display:flex;flex-direction:column;gap:14px}
.sec>h2{font-size:18px;font-weight:800;margin:0}
.band{height:12px;background:var(--ground)}

/* 3. sheet, banner, toast */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:600px;margin:0 auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding:12px 20px max(20px,var(--safe-b));max-height:80dvh;overflow-y:auto;
  display:flex;flex-direction:column;gap:16px;animation:sheet-in .25s ease-out}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto;flex:none}
.sheet h2{font-size:20px;font-weight:800;margin:0}
.raw{background:var(--fill);border-radius:14px;padding:14px;font-size:13px;line-height:1.75;color:var(--sub);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
.push{position:fixed;top:max(10px,var(--safe-t));left:10px;right:10px;z-index:45;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);
  display:flex;gap:12px;align-items:flex-start;text-align:left;animation:push-in .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes push-in{from{transform:translateY(-140%)}to{transform:none}}
.push img{width:32px;height:32px;border-radius:9px;background:#fff;flex:none}
.push .ttl{font-size:14px;font-weight:700}
.push .bd{font-size:14px;color:var(--sub);line-height:1.45}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:50;background:var(--text);color:var(--surface);
  padding:12px 18px;border-radius:14px;font-size:14px;white-space:nowrap}
@media (min-width:768px){
  .push{left:auto;right:24px;top:24px;width:380px}
  .sheet{top:50%;bottom:auto;transform:translateY(-50%);border-radius:24px;animation:none}
  .toast{bottom:100px}
}

/* 3. tab bar */
.tabbar{padding:6px 16px max(12px,var(--safe-b))}
.tabbar nav{max-width:400px;margin:0 auto;padding:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:24px;box-shadow:0 6px 24px rgba(25,31,40,.08);display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:18px;color:var(--muted)}
.tabbar button span{font-size:12px;font-weight:500}
.tabbar button:hover{color:var(--sub)}
.tabbar button[aria-current="true"]{background:var(--fill);color:var(--text)}
.tabbar button[aria-current="true"] span{font-weight:700}

/* 5.1 splash */
.splash{position:relative;height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface)}
.splash .hit{position:absolute;inset:0;width:100%;height:100%}
.splash .mid{display:flex;flex-direction:column;align-items:center;animation:rise .25s ease-out;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.splash .box{background:#fff;padding:14px 18px;border-radius:16px}
.splash .box img{width:120px;display:block}
.splash .tag{font-size:14px;color:var(--sub);text-align:center;margin:14px 32px 0}
.splash .bar{position:absolute;bottom:max(40px,var(--safe-b));left:50%;transform:translateX(-50%);width:120px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.splash .bar>i{display:block;height:100%;width:0;background:var(--accent);animation:fill 2.4s linear forwards}
@keyframes fill{to{width:100%}}

.empty{text-align:center;color:var(--muted);font-size:15px;padding:48px 0}
.empty.tight{padding:24px 0}

/* 3. chip tooltip: one open at a time on tap, hover on a mouse device */
.mchip>.tip{display:none}
.mchip[aria-expanded="true"]>.tip{display:block}
@media (hover:hover){.mchip:hover>.tip{display:block}}

/* 5.2, 5.3, 5.9 fields */
.fields{display:flex;flex-direction:column;gap:32px;padding:8px 0 24px}
.two{display:flex;gap:16px}
.two>*{flex:1;min-width:0}
.sub-field{margin-top:14px}
.sub-field>.label{display:block;margin-bottom:10px}
.rightbtn{display:flex;justify-content:flex-end}
.hint{text-align:center;font-size:14px;color:var(--muted);margin-top:8px}
.count{background:var(--accent-weak);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--sub)}
.count b{color:var(--accent);font-weight:700}
.notes{border-top:1px solid var(--line);padding:16px 8px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.notes .tbtn{color:var(--sub)}
.notes .tbtn:hover{color:var(--accent)}
.notes .demo{font-size:14px;color:var(--muted);padding:8px 0}

/* 5.4 home */
.head{padding-bottom:20px;display:flex;flex-direction:column;gap:12px}
.statusrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.statusrow .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;flex:none;background:var(--fill);border-radius:999px;
  padding:8px 14px;font-size:14px;font-weight:500;color:var(--sub)}
.pill:hover{background:var(--line)}
.pill[disabled]{opacity:.7;cursor:default}
.pill .led{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .chip{flex:none;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
.row .ttl,.row .sub{display:block}
.row .txt{flex:1;min-width:0}
.row .chev{color:var(--line);display:flex;flex:none}

/* 5.5 detail */
.dhead{padding:4px 0 24px;display:flex;flex-direction:column;gap:6px}
.dhead .h1{font-size:24px}
.dhead .lede{margin-top:0}
.altbox{border:1px solid var(--line);border-radius:16px;padding:0 16px}
.altbox .row{padding:12px 0}
.altbox .ttl{font-size:15px}
.altbox .sub{font-size:13px}
.steps>button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:16px}
.steps>button[disabled]{cursor:default}
.steps .nm{flex:1;min-width:0}
.steps>button[aria-checked="true"] .n{background:var(--accent);color:#fff}
.steps>button[aria-checked="true"] .nm{color:var(--muted);text-decoration:line-through}
.steps .when{font-size:14px;color:var(--muted);flex:none}
.links{display:flex;gap:16px;flex-wrap:wrap}

/* SPEC 8.3 되묻기 카드 (홈) and 상세에서 바로 답하기 */
.askcard{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.askcard .q{font-size:18px;font-weight:700;line-height:1.4}
.askcard .chips{width:100%}
.askwrap{display:flex;flex-direction:column;gap:8px}

/* 5.4 오늘 할 일 */
.todo{display:flex;flex-direction:column;gap:12px}
.check .ttl,.check .sml{display:block}

/* 5.8 내 계획 */
.planhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.planhead .right{display:flex;align-items:center;gap:8px;flex:none}
.seg{display:inline-flex;position:relative;height:32px;padding:3px;background:var(--fill);border-radius:999px}
.seg>i{position:absolute;top:3px;left:3px;bottom:3px;width:calc(50% - 3px);background:var(--accent);
  border-radius:999px;transition:transform .15s ease-out}
.seg.month>i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;min-width:36px;padding:0 10px;border-radius:999px;
  font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{color:#fff}
.calrow{display:flex;align-items:center;margin:8px 0 16px}
.calrow>.iconbtn{flex:none}
.cal{flex:1;min-width:0}
.cal.next{animation:cal-next .18s ease-out}
.cal.prev{animation:cal-prev .18s ease-out}
@keyframes cal-next{from{transform:translateX(20px);opacity:.4}to{transform:none;opacity:1}}
@keyframes cal-prev{from{transform:translateX(-20px);opacity:.4}to{transform:none;opacity:1}}
.wk{display:flex}
.mweek{margin-bottom:6px}
.cell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd{font-size:12px;color:var(--muted);height:18px;line-height:18px}
.day{width:36px;height:36px;border-radius:50%;font-size:16px;font-weight:700;display:grid;place-items:center}
.day.today{background:var(--accent);color:var(--on-accent)}
.day.pick{box-shadow:inset 0 0 0 2px var(--accent)}
.day.out{opacity:.35;cursor:default}
.lanes{position:relative;height:28px}
.bar{position:absolute;height:5px;background:var(--bg)}
.bar.dim{background:linear-gradient(to right,transparent,var(--bg))}
.bar.l{border-top-left-radius:3px;border-bottom-left-radius:3px}
.bar.r{border-top-right-radius:3px;border-bottom-right-radius:3px}
.bar>i{position:absolute;right:0;top:0;width:2px;height:5px;background:var(--fg)}
.over{position:absolute;bottom:0;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--muted)}
.planitem{padding:20px 0}
.planitem+.planitem{border-top:1px solid var(--line)}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;text-align:left}
.phead .nm{font-size:18px;font-weight:700}
.phead .dd{font-size:16px;font-weight:700;flex:none}
.plans+.tbtn{display:block;margin:0 auto}

/* SPEC 8.3 원문 시트: 출처별 구역과 인용 강조 */
.rawsec{display:flex;flex-direction:column;gap:8px}

}

/* ---------- helpers ---------- */
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

/* SPEC 8.3: 'YYYY-MM-DD' becomes local midnight. new Date('YYYY-MM-DD') is UTC
   and shifts every D-day and calendar cell by a day. */
const parseDate = (s) => (s ? new Date(s + "T00:00") : null);
const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
const longDate = (s) => { const d = parseDate(s); return (d.getMonth() + 1) + "월 " + d.getDate() + "일(" + WEEKDAYS[d.getDay()] + ")"; };
const shortDate = (s) => { const d = parseDate(s); return (d.getMonth() + 1) + "/" + d.getDate(); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const dday = (s) => { const n = daysBetween(state.today, s); return n === 0 ? "D-DAY" : (n > 0 ? "D-" + n : "D+" + (-n)); };
const dueText = (s) => { const n = daysBetween(state.today, s); return n < 0 ? "지남" : n === 0 ? "오늘까지" : n === 1 ? "내일까지" : shortDate(s) + "까지"; };
const secText = (ms) => (ms / 1000).toFixed(1) + "초";
const dayLabel = (s) => { const d = parseDate(s); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parseDate(s); d.setDate(1); d.setMonth(d.getMonth() + n); return ymd(d); };

const STORE_KEY = "kmu_student_id";
function readId(){ try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } }
function writeId(id){ try { localStorage.setItem(STORE_KEY, id); } catch (e) { /* private window */ } }

async function api(path, opts){
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({}, o.headers || {});
  if (state.studentId) o.headers["X-Student-Id"] = state.studentId;
  if (o.body !== undefined && typeof o.body !== "string"){
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(o.body);
  }
  const res = await fetch(path, o);
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok){
    const err = new Error("api " + res.status);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/* 8.1: the four groups. They are not an API field; the screen reads `rows`. */
function groupOf(it){
  if (it.eligible) return 1;
  const rows = it.rows || [];
  if (rows.some(function (r){ return r.status === "fail"; })) return 2;
  if (rows.some(function (r){ return r.ask; })) return 3;
  return 4;
}

function ddayHtml(end){
  const text = dday(end);
  return daysBetween(state.today, end) <= 3
    ? '<b style="color:var(--urgent);font-weight:700">' + esc(text) + '</b>'
    : esc(text);
}

/* SPEC 8.3: the 외국인 유학생 chip is hidden from the student who passes it as a
   domestic student. The row has no flag, so the pass tooltip names it. */
function chipRows(rows){
  const out = [];
  (rows || []).forEach(function (r, i){
    if (r.status === "pass" && r.tip === "외국인 유학생: 아니오") return;
    out.push({row: r, i: i});
  });
  return out;
}

function chipsHtml(key, rows, limit){
  let xs = chipRows(rows);
  if (limit){
    xs = xs.filter(function (x){ return x.row.status === "pass"; })
      .concat(xs.filter(function (x){ return x.row.status !== "pass"; }))
      .slice(0, limit);
  }
  if (!xs.length) return "";
  return '<div class="mchips">' + xs.map(function (x, n){
    const r = x.row;
    const tone = r.status === "pass" ? "pass " + toneOf(r.type) : (r.status === "fail" ? "fail" : "off");
    const pos = n === 0 ? " first" : (n === xs.length - 1 ? " last" : "");
    const id = key + "#" + x.i;
    return '<button class="mchip ' + tone + pos + '" aria-expanded="' + (state.openTip === id) + '"'
      + ' data-tip="' + esc(id) + '">' + esc(r.chip)
      + (r.tip ? '<span class="tip">' + esc(r.tip) + '</span>' : "") + '</button>';
  }).join("") + '</div>';
}

function noticeRow(it, limit){
  const g = groupOf(it);
  const sub = g === 1
    ? ddayHtml(it.apply_end) + " · " + esc(it.dept) + (it.planned ? " · 계획 중" : "")
    : (g === 3 ? "정보를 더 입력하면 확인할 수 있어요" : esc(it.gap || ""));
  return '<div class="row' + (g === 1 ? "" : " dim") + '">'
    + '<button class="top" data-key="' + esc(it.key) + '"><span class="txt">'
    + '<span class="ttl">' + (it.is_new ? '<span class="new">NEW</span>' : "") + esc(it.title) + '</span>'
    + '<span class="sub">' + sub + '</span></span>'
    + '<span class="chev">' + ICON.chevron + '</span></button>'
    + chipsHtml(it.key, it.rows, limit) + '</div>';
}

const PROFILE_KEYS = ["status", "grad_year", "grad_term", "semesters", "major", "gpa", "langs", "topik",
  "interests", "gpa_last", "credits_last", "credits_total", "income_bracket", "admission_year", "history"];

/* UI 5.3: the demo seed values a new student starts from. */
function defaultForm(){

    interests: ["장학", "인턴·현장실습", "국제교류"]};
}

function formFromProfile(p){
  const f = defaultForm();
  const h = (p && p.history) || {};
  f.intl = h["외국인 유학생"] === true;
  if (STATUSES.indexOf(p.status) >= 0) f.status = p.status;
  if (typeof p.grad_year === "number") f.grad_year = p.grad_year;
  if (GRAD_TERMS.indexOf(p.grad_term) >= 0) f.grad_term = p.grad_term;
  f.semesters = typeof p.semesters === "number" ? p.semesters : 0;
  f.major = typeof p.major === "string" ? p.major : "";
  f.gpa = typeof p.gpa === "number" ? String(p.gpa) : "";
  f.langs = Object.assign({}, p.langs || {});
  f.topik = typeof p.topik === "number" ? p.topik : (f.intl ? 0 : null);
  f.interests = (p.interests || []).slice();
  return f;
}

/* SPEC 8.3: PUT replaces the whole profile, so every key the screen does not show
   (되묻기 answers, the other identity's keys) rides along from the last profile. */
function formToProfile(){
  const f = state.form;
  const base = state.profile || {};
  const p = {};
  PROFILE_KEYS.forEach(function (k){ if (base[k] !== undefined) p[k] = base[k]; });
  p.status = f.status;
  if (f.status === "졸업예정"){
    p.grad_year = parseInt(f.grad_year, 10);
    p.grad_term = f.grad_term;
  } else {
    delete p.grad_year;
    delete p.grad_term;
  }
  p.semesters = parseInt(f.semesters, 10);
  p.major = f.major;
  p.interests = f.interests.slice();
  p.history = Object.assign({}, base.history || {});
  p.history["외국인 유학생"] = !!f.intl;
  if (f.intl){
    p.topik = f.topik == null ? null : parseInt(f.topik, 10);
  } else {
    p.gpa = (f.gpa === "" || f.gpa == null) ? null : parseFloat(f.gpa);
    const langs = {};
    LANG_TYPES.forEach(function (t){
      if (!Object.prototype.hasOwnProperty.call(f.langs, t)) return;
      const v = String(f.langs[t] == null ? "" : f.langs[t]).trim();
      if (v !== "") langs[t] = v;   // SPEC 8.3: a test with no score is dropped
    });
    p.langs = langs;
  }
  return p;
}

/* SPEC 7 학생 정보 검증. 내 정보 keeps a value that fails here to itself (it is
   still being typed) instead of sending it and showing an error toast. */
function validProfile(p){
  const isInt = (v) => typeof v === "number" && isFinite(v) && Math.floor(v) === v;
  if (STATUSES.indexOf(p.status) < 0) return false;
  if (!isInt(p.semesters) || p.semesters < 0 || p.semesters > 8) return false;
  if (typeof p.major !== "string" || p.major.length < 1 || p.major.length > 50) return false;
  if (p.status === "졸업예정"){
    if (!isInt(p.grad_year) || p.grad_year < 2026 || p.grad_year > 2029) return false;
    if (GRAD_TERMS.indexOf(p.grad_term) < 0) return false;
  }
  if (p.gpa != null){
    if (typeof p.gpa !== "number" || !isFinite(p.gpa) || p.gpa < 0 || p.gpa > 4.5) return false;
  }
  if (p.topik != null && (!isInt(p.topik) || p.topik < 0 || p.topik > 6)) return false;
  const langs = p.langs || {};
  const names = Object.keys(langs);
  for (let i = 0; i < names.length; i++){
    const t = names[i];
    const v = String(langs[t]).trim();
    if (v === "") return false;
    if (t === "OPIc"){
      if (OPIC_GRADES.indexOf(v) < 0) return false;
    } else {
      const range = LANG_RANGE[t];
      const n = Number(v);
      if (!range || !isFinite(n) || n < range[0] || n > range[1]) return false;
    }
  }
  return !(p.interests || []).some(function (c){ return ALL_CATEGORIES.indexOf(c) < 0; });
}

function isIntl(){
  const h = (state.profile || {}).history || {};
  return h["외국인 유학생"] === true;

/* 5.4 오늘 할 일: the tasks of planned notices due today or tomorrow, unfinished
   first then by 기한, three at most. */
function todayTasks(){
  const rows = [];

  rows.sort(function (a, b){

    return a.task.due < b.task.due ? -1 : (a.task.due > b.task.due ? 1 : 0);
  });

/* ---------- 5.8 내 계획 ---------- */
const TONE_ORDER = ["sem", "gpa", "lang", "major", "any"];

/* 5.8: no 신청 시작일 means "three days before the deadline", drawn faded. */
function periodOf(it){
  return {start: it.apply_start || addDays(it.apply_end, -3), end: it.apply_end, dim: !it.apply_start};
}

/* 5.8: three lanes. Walking the notices by deadline (then by start), a notice
   takes the first lane whose last bar ended before it starts. */
function assignLanes(items){
  const last = [null, null, null];
  const lanes = {};
  items.slice().sort(function (a, b){
    const pa = periodOf(a), pb = periodOf(b);
    if (pa.end !== pb.end) return pa.end < pb.end ? -1 : 1;
    if (pa.start !== pb.start) return pa.start < pb.start ? -1 : 1;
    return 0;
  }).forEach(function (it){
    const p = periodOf(it);
    lanes[it.key] = -1;
    for (let i = 0; i < 3; i++){
      if (last[i] === null || last[i] < p.start){ last[i] = p.end; lanes[it.key] = i; break; }
    }
  });
  return lanes;
}

function lanesHtml(weekStart, lanes){
  const weekEnd = addDays(weekStart, 6);
  let html = "";
  state.plan.forEach(function (it, i){
    const lane = lanes[it.key];
    if (lane == null || lane < 0) return;
    const p = periodOf(it);
    if (p.end < weekStart || p.start > weekEnd) return;
    const from = Math.max(0, daysBetween(weekStart, p.start));
    const to = Math.min(6, daysBetween(weekStart, p.end));
    const tone = TONE_ORDER[i % TONE_ORDER.length];
    const cls = "bar" + (p.start >= weekStart ? " l" : "") + (p.end <= weekEnd ? " r" : "") + (p.dim ? " dim" : "");
    html += '<button class="' + cls + '" data-key="' + esc(it.key) + '" aria-label="' + esc(it.title) + '"'
      + ' style="--bg:var(--tone-' + tone + '-bg);--fg:var(--tone-' + tone + '-fg);'
      + 'left:' + (from / 7 * 100) + '%;width:' + ((to - from + 1) / 7 * 100) + '%;top:' + (lane * 7) + 'px">'
      + (p.end <= weekEnd ? '<i></i>' : "") + '</button>';
  });
  /* 5.8: more than three notices on one day shows what is left over */
  for (let d = 0; d < 7; d++){
    const day = addDays(weekStart, d);
    let n = 0;
    state.plan.forEach(function (it){
      const p = periodOf(it);
      if (p.start <= day && day <= p.end) n++;
    });
    if (n > 3){
      html += '<span class="over" style="left:' + ((d + 0.5) / 7 * 100) + '%">+' + (n - 3) + '</span>';
    }
  }
  return '<div class="lanes">' + html + '</div>';
}

function dayCell(day, weekday, out){
  const isToday = day === state.today;
  const cls = "day" + (isToday ? " today" : "") + (state.planPick === day ? " pick" : "") + (out ? " out" : "");
  const n = parseDate(day).getDate();
  return '<div class="cell"><span class="wd">' + esc(weekday) + '</span>'
    + (out ? '<span class="' + cls + '">' + n + '</span>'
           : '<button class="' + cls + '" data-day="' + day + '">' + n + '</button>')
    + '</div>';
}

function weekRow(weekStart, lanes, month){
  let cells = "";
  for (let i = 0; i < 7; i++){
    const day = addDays(weekStart, i);
    const out = month != null && parseDate(day).getMonth() !== month;
    cells += dayCell(day, month == null ? WEEKDAYS[parseDate(day).getDay()] : "", out);
  }
  return '<div class="wk">' + cells + '</div>' + lanesHtml(weekStart, lanes);
}

function calendarHtml(){
  const lanes = assignLanes(state.plan);
  const slide = state.slide ? " " + state.slide : "";
  let inner;
  let prevLabel, nextLabel;
  if (state.planView === "week"){
    inner = weekRow(state.planAnchor, lanes, null);
    prevLabel = "이전 주";
    nextLabel = "다음 주";
  } else {
    const first = state.planAnchor.slice(0, 8) + "01";
    const month = parseDate(first).getMonth();
    const gridStart = addDays(first, -parseDate(first).getDay());
    const days = daysBetween(gridStart, addMonths(first, 1)) ;
    const rows = Math.ceil(days / 7);
    let body = '<div class="wk">' + WEEKDAYS.map(function (w){
      return '<div class="cell"><span class="wd">' + w + '</span></div>';
    }).join("") + '</div>';
    for (let r = 0; r < rows; r++){
      body += '<div class="mweek">' + weekRow(addDays(gridStart, r * 7), lanes, month) + '</div>';
    }
    inner = body;
    prevLabel = "이전 달";
    nextLabel = "다음 달";
  }
  return '<div class="calrow">'
    + '<button class="iconbtn sm" data-cal="-1" aria-label="' + prevLabel + '">' + ICON.back + '</button>'
    + '<div class="cal' + slide + '">' + inner + '</div>'
    + '<button class="iconbtn sm" data-cal="1" aria-label="' + nextLabel + '">' + ICON.next + '</button>'
    + '</div>';
}

function taskRow(task){
  const on = state.planPick && task.due === state.planPick;
  return '<button class="task' + (on ? " on" : "") + '" role="checkbox" aria-checked="' + (!!task.done) + '"'
    + ' data-task="' + esc(task.id) + '" data-done="' + (task.done ? "0" : "1") + '">'
    + '<span class="dot">' + (task.done ? ICON.check : "") + '</span>'
    + '<span class="name">' + esc(task.title) + '</span>'
    + '<span class="when">' + (task.due ? esc(shortDate(task.due)) : "") + '</span></button>';

  const atToday = state.planView === "week"

    : state.planAnchor.slice(0, 7) === state.today.slice(0, 7);
  const picked = state.planPick;
  const dueHere = picked && state.plan.some(function (it){

  });

  let list;
  if (!state.plan.length){
    list = '<div class="empty">홈에서 기회를 골라 계획에 넣어 보세요</div>';
  } else {

      return '<div class="planitem">'
        + '<button class="phead" data-key="' + esc(it.key) + '"><span class="nm">' + esc(it.title) + '</span>'

        + '</div>';
    }).join("") + '</div>'
      + '<button class="tbtn" data-cal-add="1">캘린더 앱에 모두 추가</button>';
  }

  const html = '<div class="screen ground enter">'
    + topbar('<span class="tabtitle">내 계획</span>', personBtn)
    + '<div class="scroll"><div class="col">'
    + '<div class="planhead"><span class="label">' + esc(label) + '</span><span class="right">'

    + '<span class="seg' + (state.planView === "month" ? " month" : "") + '" role="group" aria-label="주/월 보기"><i></i>'
    + '<button data-planview="week" aria-pressed="' + (state.planView === "week") + '">주</button>'
    + '<button data-planview="month" aria-pressed="' + (state.planView === "month") + '">월</button>'
    + '</span></span></div>'
    + calendarHtml()
    + (picked && !dueHere ? '<div class="label">' + esc(longDate(picked)) + '에는 준비할 일이 없어요</div>' : "")
    + list
    + '</div></div>' + tabbar() + '</div>';
  state.slide = "";   // the slide plays once
  return html;
}

/* ---------- 5.5 detail ---------- */
const kvRow = (k, v) => '<div class="kv"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>';

/* SPEC 8.3 상세에서 바로 답하기: an onboarding key keeps the mockup's "입력하기"
   (내 정보), a 되묻기 key unfolds the GET /api/ask?field= choices under the row. */
function askRowHtml(r){
  const field = r.field || "";
  const open = state.rowAsk && state.rowAsk.field === field;
  return '<div class="askwrap"><div class="askrow"><span>' + esc(r.ask) + '</span>'
    + '<button class="tbtn" data-ask="' + esc(field) + '" aria-expanded="' + (!!open) + '">입력하기</button></div>'
    + (open ? '<div class="chips">' + (state.rowAsk.card.choices || []).map(function (c, i){
      return '<button class="chip" data-ranswer="' + i + '">' + esc(c.label) + '</button>';
    }).join("") + '</div>' : "") + '</div>';
}

function detailCta(d, g){
  if (d.planned) return '<button class="cta weak" data-plan="0">계획에서 빼기</button>';
  if (g === 3) return '<button class="cta" data-ask-first="1">정보 입력하고 확인하기</button>';
  if (g === 1) return '<button class="cta" data-plan="1">계획에 넣기</button>';
  return '<button class="cta off" disabled>' + esc(d.gap || "") + '</button>';
}

function detailView(){
  const d = state.detail;
  if (!d || d.key !== state.detailKey){
    return '<div class="screen enter">' + topbar(backBtn(), "") + '<div class="scroll"></div></div>';
  }
  const rows = d.rows || [];
  const g = groupOf(d);
  const verdict = {
    1: ["ok", ICON.check, "지원할 수 있어요"],
    2: ["no", ICON.x, "지금은 지원할 수 없어요"],
    3: ["wait", "?", "정보를 더 입력하면 확인할 수 있어요"],
    4: ["wait", "?", d.gap || "지원 자격 확인 중"]
  }[g];

  let h = '<div class="screen enter">' + topbar(backBtn(), "") + '<div class="scroll">';
  h += '<div class="col dhead"><span class="label">' + esc(d.dept) + '</span>'
    + '<h1 class="h1">' + esc(d.title) + '</h1>'
    + '<div class="lede">' + esc(longDate(d.apply_end)) + ' 마감 · ' + ddayHtml(d.apply_end) + '</div></div>';

  h += '<div class="band"></div><div class="col sec">'
    + '<div class="verdict ' + verdict[0] + '"><span class="ic">' + verdict[1] + '</span>' + esc(verdict[2]) + '</div>'
    + chipsHtml(d.key, rows, 0)
    + rows.filter(function (r){ return r.ask; }).map(askRowHtml).join("") + '</div>';

  if (g === 2 && d.alt){
    h += '<div class="band"></div><div class="col sec"><h2>대신 이건 지원할 수 있어요</h2>'
      + '<div class="altbox">' + noticeRow(d.alt, 4) + '</div></div>';
  }

  const tasks = d.tasks || [];
  if (tasks.length){
    h += '<div class="band"></div><div class="col sec"><h2>준비할 것</h2><div class="steps">'
      + tasks.map(function (t, i){
        return '<button role="checkbox" aria-checked="' + (!!t.done) + '" data-task="' + esc(t.id) + '"'
          + ' data-done="' + (t.done ? "0" : "1") + '"' + (d.planned ? "" : " disabled") + '>'
          + '<span class="n">' + (t.done ? ICON.checkSm : (i + 1)) + '</span>'
          + '<span class="nm">' + esc(t.title) + '</span>'
          + '<span class="when">' + (t.due ? esc(longDate(t.due)) : "") + '</span></button>';
      }).join("") + '</div>'
      + (d.planned ? "" : '<div class="askrow"><span>계획에 넣으면 하나씩 체크할 수 있어요</span></div>')
      + '</div>';
  }

  /* SPEC 8.3: 자격요건 joins the chips, not `need`, so each one reads on its own. */
  const req = rows.length ? rows.map(function (r){ return r.chip; }).join(" · ") : "재학생 누구나";
  const period = (d.apply_start ? shortDate(d.apply_start) + " ~ " : "~ ") + longDate(d.apply_end);
  h += '<div class="band"></div><div class="col sec"><h2>공지 요약</h2>'
    + '<dl style="margin:0">' + kvRow("자격요건", req) + kvRow("신청 기간", period)
    + (d.fields || []).map(function (f){ return kvRow(f[0], f[1]); }).join("") + '</dl>'
    + '<div class="links"><button class="tbtn" data-raw="1">' + esc(d.dept) + ' 원문 보기</button>'
    + '<a class="tbtn" href="' + esc(d.url || "") + '" target="_blank" rel="noopener">국민대 공지사항 게시판에서 보기</a>'
    + '</div></div>';

  return h + '</div><div class="bottom"><div class="col">' + detailCta(d, g) + '</div></div></div>';
}

/* ---------- 5.9 profile ---------- */
const countText = () => '지금 조건으로 <b>' + state.eligibleCount + '개</b>에 지원할 수 있어요';

function profileView(){
  const f = state.form;
  const d = parseDate(state.today);
  return '<div class="screen enter">' + topbar(backBtn(), "")
    + '<div class="scroll"><div class="col fields">'
    + '<h1 class="h1">내 정보</h1>'
    + '<div class="count" id="cnt">' + countText() + '</div>'

    + (f.intl ? fieldTopik() + fieldInterests() : fieldGpa() + fieldLangs() + fieldInterests())
    + '<div class="notes">'

    + '<span class="demo">데모 기준일은 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일('
    + WEEKDAYS[d.getDay()] + ')이에요</span>'
    + '<button class="tbtn" data-restart="1">처음부터 보기</button>'

const VIEWS = {
  splash: splashView,
  ob1: function (){ return obStep1(false); },
  ob2: function (){ return obStep2(false); },
  obi1: function (){ return obStep1(true); },
  obi2: function (){ return obStep2(true); },
  home: homeView,
  chat: function (){ return tabPlaceholder("대화", "대화 화면은 T15가 만든다"); },
  plan: planView,
  detail: detailView,
  profile: profileView
};

/* ---------- render ---------- */
let lastScreen = null;
function render(){
  const app = document.getElementById("app");
  const view = VIEWS[state.screen] || homeView;
  const old = app.querySelector(".scroll");
  const keep = (lastScreen === state.screen && old) ? old.scrollTop : 0;
  app.innerHTML = view();
  const sc = app.querySelector(".scroll");
  if (sc && keep) sc.scrollTop = keep;
  lastScreen = state.screen;
  drawOverlay();
}

/* 4. moving between screens saves what is being typed, closes the sheet and any
   chip tooltip, and goes to the top. */
function go(screen, from){
  if (state.screen === screen) return;
  syncInputs();
  if (state.screen === "profile" && scheduleSave._t){
    clearTimeout(scheduleSave._t);
    scheduleSave._t = null;
    saveProfile();
  }
  if (from){
    /* 4: detail <-> 내 정보 and detail -> detail keep the screen they came from.
       From onboarding the back button goes home. */
    if (from === "detail" || from === "profile"){ /* keep state.back */ }
    else if (from.indexOf("ob") === 0) state.back = "home";
    else state.back = from;
  }
  const prev = state.screen;
  state.openTip = null;
  state.sheet = null;
  state.comboOpen = false;
  state.rowAsk = null;
  state.screen = screen;
  lastScreen = null;
  enterForm(screen, prev);
  if (screen === "plan") resetPlan();
  render();
  if (screen === "home" && (!state.noticesLoaded || state.noticesStale)) refreshNotices();
  if (screen === "home" || screen === "plan") ensurePlan();
}

/* The onboarding draft survives ob1 <-> ob2. Every other way in rebuilds the
   fields from the profile the server last gave us. */
function enterForm(screen, prev){
  const isOb = screen.indexOf("ob") === 0;
  const wasOb = prev && prev.indexOf("ob") === 0;
  if (screen !== "profile" && !(isOb && !wasOb)) return;
  const p = state.profile;
  state.form = (p && Object.keys(p).length) ? formFromProfile(p) : defaultForm();
  if (isOb) state.form.intl = (screen === "obi1" || screen === "obi2");
  state.majorText = state.form.major;
  state.comboOpen = false;
}

function openDetail(key){
  state.detailKey = key;
  state.detail = null;
  state.rowAsk = null;
  if (state.screen === "detail"){
    state.openTip = null;
    render();
  } else {
    go("detail", state.screen);
  }
  loadDetail(key);
}

/* ---------- one delegated click handler ---------- */
document.addEventListener("click", function (e){
  let el;
  if ((el = e.target.closest("[data-skip-splash]"))) { leaveSplash(); return; }
  if ((el = e.target.closest("[data-tab]"))) { go(el.getAttribute("data-tab")); return; }
  if ((el = e.target.closest("[data-go]"))) { go(el.getAttribute("data-go"), state.screen); return; }
  if ((el = e.target.closest("[data-back]"))) { go(state.back || "home"); return; }
  if ((el = e.target.closest("[data-close-sheet]"))) { closeSheet(); return; }
  if ((el = e.target.closest("[data-push]"))) {
    const key = state.push && state.push.notice_key;
    state.push = null;
    drawOverlay();
    if (key) openDetail(key);
    return;
  }
});

/* ---------- 4. keeping typed values, the 학과 combo, the 다음 button ---------- */

/* 4: before any re-render the values in the input boxes move into `state`, or a
   typed 학점 disappears when an 어학 chip is pressed. */
function syncInputs(){
  if (!state.form) return;
  const el = (id) => document.getElementById(id);
  const sem = el("sem");
  if (sem) state.form.semesters = parseInt(sem.value, 10);
  const gy = el("gy");
  if (gy) state.form.grad_year = parseInt(gy.value, 10);
  const gt = el("gt");
  if (gt) state.form.grad_term = gt.value;
  const gpa = el("gpa");
  if (gpa) state.form.gpa = gpa.value;
  const major = el("major");
  if (major){
    state.majorText = major.value;
    if (isDept(major.value)) state.form.major = major.value;   // 4: only a listed name
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-langid]"), function (node){
    state.form.langs[node.getAttribute("data-langid")] = node.value;
  });
}

function updateCombo(){
  const box = document.getElementById("deptlist");
  if (!box) return;
  if (!state.comboOpen){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = comboHtml(state.majorText);
}

/* 5.2: while the 학과 box has focus only the button and the hint change, so the
   caret and the open list survive. */
function updateNext(){
  const btn = document.getElementById("nextbtn");
  if (!btn) return;
  const ok = isDept(state.majorText);
  btn.disabled = !ok;
  btn.classList.toggle("off", !ok);
  const hint = document.getElementById("majorhint");
  if (hint) hint.style.display = ok ? "none" : "";
}

function afterFormChange(){
  render();
  if (state.screen === "profile") scheduleSave();
}

/* 8.3: 내 정보 saves 400ms after the last change. */
function scheduleSave(){
  clearTimeout(scheduleSave._t);
  scheduleSave._t = setTimeout(function (){ scheduleSave._t = null; saveProfile(); }, 400);
}

async function saveProfile(){
  syncInputs();
  const profile = formToProfile();
  if (!validProfile(profile)) return;   // 8.3: a value still being typed is not sent
  try {
    const me = await api("/api/me", {method: "PUT", body: profile});
    state.profile = me.profile;
    state.eligibleCount = me.eligible_count;
    state.noticesStale = true;
    const box = document.getElementById("cnt");
    if (box) box.innerHTML = countText();
  } catch (err){ apiToast(err); }
}

async function finishOnboarding(){
  syncInputs();
  try {
    const me = await api("/api/me", {method: "PUT", body: formToProfile()});
    state.profile = me.profile;
    state.eligibleCount = me.eligible_count;
  } catch (err){ apiToast(err); return; }
  /* 8.3: the interests become the category filter once, on the first home. */
  const list = CATS.filter(function (c){ return c !== "한국어·문화" || isIntl(); });
  state.cats = (state.form.interests || []).filter(function (c){ return list.indexOf(c) >= 0; });
  state.noticesStale = true;
  go("home");
}

async function refreshNotices(){
  try {
    const body = await api("/api/notices");
    state.notices = (body && body.items) || [];
    state.noticesLoaded = true;
    state.noticesStale = false;
  } catch (err){ apiToast(err); }
  render();
  loadAsk();   /* 8.3: the 되묻기 card is redrawn with the list it belongs to */
}

async function loadDetail(key){
  try {
    const detail = await api("/api/notices/" + encodeURIComponent(key));
    if (state.detailKey !== key) return;
    state.detail = detail;
    render();
  } catch (err){ apiToast(err); }
}

/* ---------- 5.8, 6 계획, 할 일, 알림, 새 공지 (SPEC 7, 8.3) ---------- */
async function loadPlan(){
  try {
    const body = await api("/api/plan");
    state.plan = (body && body.items) || [];
    state.planLoaded = true;
  } catch (err){ apiToast(err); }
  render();
}

function ensurePlan(){ if (!state.planLoaded) loadPlan(); }

/* 5.8: 내 계획 always opens on this week. */
function resetPlan(){
  state.planView = "week";
  state.planAnchor = addDays(state.today, -1);   /* 5.8: 어제부터 7일 */
  state.planPick = state.today;
  state.slide = "";
}

async function setPlanned(key, on){
  try {
    await api("/api/plan/" + encodeURIComponent(key), {method: on ? "POST" : "DELETE"});
  } catch (err){ apiToast(err); return; }
  toast(on ? "내 계획에 넣었어요" : "계획에서 뺐어요");
  loadPlan();
  refreshNotices();
  if (state.detailKey) loadDetail(state.detailKey);
}

async function setTask(id, done, title){
  try {
    await api("/api/tasks/" + encodeURIComponent(id), {method: "PUT", body: {done: done}});
  } catch (err){ apiToast(err); return; }
  /* 5.4: this toast belongs to the home card only */
  if (done && title && state.screen === "home") toast("'" + title + "' 완료");
  loadPlan();
  if (state.screen === "detail" && state.detailKey) loadDetail(state.detailKey);
}

/* 6 + SPEC 8.3: count to 30 in 72ms steps (the mockup's ~2.2s), then reveal. */
function startCheck(){
  if (state.checking > 0) return;
  if (state.screen !== "home") go("home");
  state.checking = 1;
  render();
  startCheck._t = setInterval(function (){
    if (state.checking >= 30){
      clearInterval(startCheck._t);
      finishCheck();
      return;
    }
    state.checking += 1;
    const pill = document.getElementById("pill");
    if (pill) pill.innerHTML = pillInner();
  }, 72);
}

async function finishCheck(){
  state.checking = 0;
  state.checked = true;
  let items = [];
  try {
    const body = await api("/api/reveal-new", {method: "POST"});
    items = (body && body.items) || [];
  } catch (err){
    render();
    apiToast(err);
    return;
  }
  if (!items.length){
    render();
    toast("새로 올라온 공지가 없어요");
    return;
  }
  await refreshNotices();
  const it = items[0];
  const g = groupOf(it);
  if (g === 1) banner("새 기회를 찾았어요", it.title + " · 내 조건으로 지원할 수 있어요", it.key);
  else if (g === 2) banner("새 공지가 올라왔어요", it.title + " · 지금 조건으로는 지원할 수 없어요", it.key);
  else if (g === 3) banner("새 공지가 올라왔어요", it.title + " · 정보를 더 입력하면 확인할 수 있어요", it.key);
  else banner("새 공지가 올라왔어요", it.title + " · " + (it.gap || ""), it.key);
}

/* SPEC 8.3 기존 동작 연결: the first alert that is not the 새 공지 one. */
async function showAlert(){
  let list = [];
  try {
    list = await api("/api/alerts") || [];
  } catch (err){ apiToast(err); return; }
  const alert = list.filter(function (a){ return a.kind !== "new"; })[0];
  if (!alert){ toast("받을 알림이 없어요"); return; }
  banner(alert.title, alert.body || "", alert.notice_key);
}

/* SPEC 8.1 `field`: an onboarding key goes to 내 정보, a 되묻기 key is answered
   right here (SPEC 8.3 "상세에서 바로 답하기"). */
async function askAction(field){
  if (!field || ONBOARDING_FIELDS.indexOf(field) >= 0){ go("profile", state.screen); return; }
  if (state.rowAsk && state.rowAsk.field === field){ state.rowAsk = null; render(); return; }
  try {
    const card = await api("/api/ask?field=" + encodeURIComponent(field));
    if (!card) return;   // 7: null when no visible notice is missing that key
    state.rowAsk = {field: field, card: card};
    render();
  } catch (err){ apiToast(err); }
}

/* 7: the answer goes back as a profile key, and a history flag as one entry of
   `history` ("history:{flag}" as a key is a 422). */
function askBody(field, value){
  const body = {};
  if (field.slice(0, 8) === "history:"){
    body.history = {};
    body.history[field.slice(8)] = value;
  } else {
    body[field] = value;
  }
  return body;
}

async function loadAsk(){
  try {
    state.ask = await api("/api/ask");
  } catch (err){
    /* ponytail: a failed 되묻기 card only hides itself -- it is an extra on home,
       and a toast on every list refresh would be noise. */
    state.ask = null;
  }
  render();
}

async function answerAsk(card, choice, fromRow){
  try {
    const me = await api("/api/me", {method: "PATCH", body: askBody(card.field, choice.value)});
    state.profile = me.profile;
    state.eligibleCount = me.eligible_count;
  } catch (err){ apiToast(err); return; }
  toast("공지 " + card.unlock + "개가 정리됐어요");
  if (fromRow){
    state.rowAsk = null;
    if (state.detailKey) loadDetail(state.detailKey);
  }
  refreshNotices();
}

/* ---------- 5.6 원문 시트 (SPEC 7 원문 시트, 8.3 UI 변경) ---------- */

/* ponytail: `highlights` counts Python characters and slice() counts UTF-16
   units, so a notice with an emoji would shift. Every card quote is Korean
   text; count code points here if that ever changes. */
function markText(text, spans){
  const out = [];
  let at = 0;
  (spans || []).forEach(function (span){
    const from = Math.max(at, span[0]);
    const to = span[1];
    if (to <= from) return;
    out.push(esc(text.slice(at, from)));
    out.push("<mark>" + esc(text.slice(from, to)) + "</mark>");
    at = to;
  });
  out.push(esc(text.slice(at)));
  return out.join("");
}

function rawSheetHtml(d, sheet){
  const sections = (sheet && sheet.sections) || [];
  const posted = d.posted_date ? " · " + longDate(d.posted_date) + " 게시" : "";
  return '<h2>공지 원문</h2>'
    + (sheet && sheet.path ? '<div class="label">' + esc(sheet.path) + '</div>' : "")
    + '<div class="label">' + esc(d.dept) + ' 게시판' + esc(posted) + '</div>'
    + sections.map(function (sec){
      /* a section can be empty (an image-only notice keeps its 본문 row), and an
         empty grey box reads like a bug, so only the head is left. */
      return '<div class="rawsec"><div class="sechead"><span class="nm">' + esc(sec.label) + '</span>'
        + (sec.url ? '<a class="tbtn" href="' + esc(sec.url) + '" target="_blank" rel="noopener">출처 열기</a>' : "")
        + '</div>'
        + (sec.text ? '<div class="raw">' + markText(sec.text, sec.highlights) + '</div>' : "")
        + '</div>';
    }).join("")
    + '<a class="tbtn" href="' + esc(d.url || "") + '" target="_blank" rel="noopener">국민대 공지사항 게시판에서 보기</a>'
    + '<button class="cta weak" data-close-sheet="1">닫기</button>';
}

async function openRaw(){
  const d = state.detail;
  if (!d) return;
  let sheet;
  try {
    sheet = await api("/api/notices/" + encodeURIComponent(d.key) + "/raw");
  } catch (err){ apiToast(err); return; }
  openSheet(rawSheetHtml(d, sheet), "공지 원문");
  /* 8.3: open on the first quote. */
  const box = document.querySelector(".sheet");
  const mark = box && box.querySelector("mark");
  if (mark) mark.scrollIntoView({block: "center"});
}

/* ---------- clicks on the T09 screens ---------- */
document.addEventListener("click", function (e){
  let el;

  /* home and detail */
  if ((el = e.target.closest("[data-tip]"))){
    const id = el.getAttribute("data-tip");
    state.openTip = state.openTip === id ? null : id;
    render();
    return;
  }
  if ((el = e.target.closest("[data-key]"))){ openDetail(el.getAttribute("data-key")); return; }
  if ((el = e.target.closest("[data-open]"))){
    const id = el.getAttribute("data-open");
    state.open[id] = !state.open[id];
    render();
    return;
  }
  if ((el = e.target.closest("[data-cat]"))){
    const cat = el.getAttribute("data-cat");
    if (cat === "") state.cats = [];   // SPEC 8.3: "전체" turns every filter off
    else {
      const at = state.cats.indexOf(cat);
      if (at >= 0) state.cats.splice(at, 1); else state.cats.push(cat);
    }
    render();
    return;
  }
  if ((el = e.target.closest("[data-ask]"))){ askAction(el.getAttribute("data-ask")); return; }
  if (e.target.closest("[data-ask-first]")){
    const rows = (state.detail && state.detail.rows) || [];
    const first = rows.filter(function (r){ return r.ask; })[0];
    askAction(first ? (first.field || "") : "");
    return;
  }

  /* 되묻기: the home card, the choices under a detail row, 모르겠어요 */
  if ((el = e.target.closest("[data-answer]"))){
    const card = state.ask;
    const choice = card && (card.choices || [])[parseInt(el.getAttribute("data-answer"), 10)];
    if (choice) answerAsk(card, choice, false);
    return;
  }
  if ((el = e.target.closest("[data-ranswer]"))){
    const open = state.rowAsk;
    const choice = open && (open.card.choices || [])[parseInt(el.getAttribute("data-ranswer"), 10)];
    if (choice) answerAsk(open.card, choice, true);
    return;
  }
  if (e.target.closest("[data-ask-skip]")){
    /* 8.3: hidden until the page is reloaded, and only this question. */
    if (state.ask) state.askHidden.push(state.ask.field);
    render();
    return;
  }
  if (e.target.closest("[data-raw]")){ openRaw(); return; }

  /* 계획, 할 일, 달력, 알림, 새 공지 확인 */
  if ((el = e.target.closest("[data-plan]"))){
    if (state.detailKey) setPlanned(state.detailKey, el.getAttribute("data-plan") === "1");
    return;
  }
  if ((el = e.target.closest("[data-task]"))){
    setTask(el.getAttribute("data-task"), el.getAttribute("data-done") === "1", el.getAttribute("data-title"));
    return;
  }
  if ((el = e.target.closest("[data-day]"))){
    const day = el.getAttribute("data-day");
    state.planPick = state.planPick === day ? null : day;   /* 5.8: press again to drop it */
    render();
    return;
  }
  if ((el = e.target.closest("[data-cal]"))){
    const step = parseInt(el.getAttribute("data-cal"), 10);
    state.planAnchor = state.planView === "week"
      ? addDays(state.planAnchor, 7 * step)
      : addMonths(state.planAnchor, step);
    state.slide = step > 0 ? "next" : "prev";
    render();
    return;
  }
  if ((el = e.target.closest("[data-planview]"))){
    const view = el.getAttribute("data-planview");
    if (view !== state.planView){
      /* 5.8: 월 shows the month the week started in, 주 goes back to this week */
      state.planAnchor = view === "month" ? state.planAnchor : addDays(state.today, -1);
      state.planView = view;
      render();
    }
    return;
  }
  if (e.target.closest("[data-today]")){
    state.planAnchor = state.planView === "week" ? addDays(state.today, -1) : state.today;
    render();
    return;
  }
  if (e.target.closest("[data-cal-add]")){ toast("캘린더 앱에 추가했어요 (시안)"); return; }
  if (e.target.closest("[data-refresh]")){ startCheck(); return; }
  if (e.target.closest("[data-alerts]")){ showAlert(); return; }

  /* fields */
  if ((el = e.target.closest("[data-status]"))){
    syncInputs();
    state.form.status = el.getAttribute("data-status");
    afterFormChange();
    return;
  }
  if ((el = e.target.closest("[data-intl]"))){
    syncInputs();
    setIntl(el.getAttribute("data-intl") === "1");
    afterFormChange();
    return;
  }
  if ((el = e.target.closest("[data-lang]"))){
    syncInputs();
    const test = el.getAttribute("data-lang");
    if (Object.prototype.hasOwnProperty.call(state.form.langs, test)) delete state.form.langs[test];
    else state.form.langs[test] = LANG_DEFAULT[test];
    afterFormChange();
    return;
  }
  if ((el = e.target.closest("[data-topik]"))){
    syncInputs();
    state.form.topik = parseInt(el.getAttribute("data-topik"), 10);
    afterFormChange();
    return;
  }
  if ((el = e.target.closest("[data-interest]"))){
    syncInputs();
    const cat = el.getAttribute("data-interest");
    const at = state.form.interests.indexOf(cat);
    if (at >= 0) state.form.interests.splice(at, 1); else state.form.interests.push(cat);
    afterFormChange();
    return;
  }
  if ((el = e.target.closest("[data-dept]"))){
    const name = el.getAttribute("data-dept");
    state.majorText = name;
    state.form.major = name;
    const input = document.getElementById("major");
    if (input) input.value = name;
    state.comboOpen = false;
    updateCombo();
    updateNext();
    if (state.screen === "profile") scheduleSave();
    return;
  }

  /* onboarding and 내 정보 */
  if (e.target.closest("[data-next]")){
    syncInputs();
    if (!isDept(state.majorText)) return;
    go(state.form.intl ? "obi2" : "ob2", state.screen);
    return;
  }
  if ((el = e.target.closest("[data-switch]"))){
    syncInputs();
    const intl = el.getAttribute("data-switch") === "1";
    setIntl(intl);
    go(intl ? "obi1" : "ob1", state.screen);
    return;
  }
  if (e.target.closest("[data-finish]")){ finishOnboarding(); return; }
  if (e.target.closest("[data-restart]")){ go(isIntl() ? "obi1" : "ob1", state.screen); return; }

  /* T10 fills data-raw, T11 data-plan, data-task, data-refresh and data-alerts. */
});

document.addEventListener("input", function (e){
  const node = e.target;
  if (!node || !node.tagName) return;
  if (node.id === "major"){
    state.majorText = node.value;
    const ok = isDept(node.value);
    if (ok) state.form.major = node.value;
    updateCombo();
    updateNext();
    if (ok && state.screen === "profile") scheduleSave();
    return;
  }
  if (node.id === "gpa"){
    state.form.gpa = node.value;
    if (state.screen === "profile") scheduleSave();
    return;
  }
  if (node.getAttribute("data-langid")){
    state.form.langs[node.getAttribute("data-langid")] = node.value;
    if (state.screen === "profile") scheduleSave();
  }
});

document.addEventListener("change", function (e){
  const node = e.target;
  if (!node || !node.tagName) return;
  if (node.id === "sem") state.form.semesters = parseInt(node.value, 10);
  else if (node.id === "gy") state.form.grad_year = parseInt(node.value, 10);
  else if (node.id === "gt") state.form.grad_term = node.value;
  else if (node.getAttribute("data-langid")) state.form.langs[node.getAttribute("data-langid")] = node.value;
  else return;
  if (state.screen === "profile") scheduleSave();
});

/* 3. 학과 콤보: opens on focus, closes 0.15s after it leaves (time to tap a row). */
document.addEventListener("focusin", function (e){
  if (e.target && e.target.id === "major"){ state.comboOpen = true; updateCombo(); }
});
document.addEventListener("focusout", function (e){
  if (!e.target || e.target.id !== "major") return;
  setTimeout(function (){ state.comboOpen = false; updateCombo(); }, 150);
});

document.addEventListener("keydown", function (e){
  if (e.key === "Escape" && state.sheet) closeSheet();
});

/* ---------- boot (SPEC 8.3 "학생 id") ---------- */
let splashDone = false;
async function leaveSplash(){
  if (splashDone) return;
  splashDone = true;
  clearTimeout(leaveSplash._t);
  try {
    const me = await api("/api/me");
    state.profile = me.profile;
    state.eligibleCount = me.eligible_count;
    go(me.profile && Object.keys(me.profile).length ? "home" : "ob1");
  } catch (err) {
    if (err.status === 401) await newStudent();
    go("ob1");
  }
}

async function newStudent(){
  try {
    const r = await api("/api/students", {method: "POST"});
    state.studentId = r.id;
    state.profile = {};
    writeId(r.id);
  } catch (err) { apiToast(err); }
}

async function boot(){
  try {
    const cfg = await api("/api/config");
    state.today = cfg.today;
    state.sources = cfg.sources;
    state.suggested = cfg.suggested_questions || [];
  } catch (e) { /* keep the defaults so the splash still shows */ }
  state.form = defaultForm();
  state.majorText = state.form.major;
  resetPlan();
  state.studentId = readId();
  if (!state.studentId) await newStudent();
  render();
  leaveSplash._t = setTimeout(leaveSplash, 2400);
}

boot();
</script>
